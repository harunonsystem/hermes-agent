[project]
name = "hermes-agent-config"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "ruff>=0.14,<0.16",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
